spring.application.name=ai-study-assistant
# Read project-root .env as Java properties; OS environment variables take priority.
spring.config.import=optional:file:./.env[.properties]
server.port=8080
# 0 preserves baseline ranking; evaluate title bonus before enabling it.
study.retrieval.title-bonus-weight=${STUDY_RETRIEVAL_TITLE_BONUS_WEIGHT:0}
# Keep fake by default; opt in with STUDY_LLM_MODE=deepseek.
study.llm.mode=${STUDY_LLM_MODE:fake}
study.llm.deepseek.api-key=${DEEPSEEK_API_KEY:}
study.llm.deepseek.model=deepseek-v4-pro
study.llm.deepseek.max-tokens=1024
study.llm.deepseek.connect-timeout-seconds=5
study.llm.deepseek.read-timeout-seconds=60
study.knowledge-directory=knowledge
study.allowed-files=sample-mysql.md
server.address=127.0.0.1
